name: challenge-tracker

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  Database__Provider: SqlServer
  ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ChallengeTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
  Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env (at least 32 bytes)}"
  Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost:5173}"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  migrate:
    build: .
    environment: *api-environment
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    environment: *api-environment
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql-data:
